volumes:
  certs:
  cassandra_data:
  es_data_01:
  kibana_data:
  kafka_connect_data:
  kafka_data:

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - elastic-pipeline

  kafka-connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    container_name: kafka-connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      CONNECT_HEAP_OPTS: -Xms512m -Xmx1g
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9092"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      KAFKA_LOG4J_LOGGERS: org.apache.kafka.connect.runtime.isolation=DEBUG
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: "kafka-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
    user: root
    command:
      - bash
      - -c
      - |
        keytool -import -trustcacerts -alias es-ca -file /certs/ca/ca.crt -keystore /tmp/truststore.jks -storepass changeit -noprompt
        chmod 644 /tmp/truststore.jks
        while ! nc -z kafka 9092; do sleep 1; done
        exec /etc/confluent/docker/run
    volumes:
      - kafka_connect_data:/data
      - certs:/certs:ro
    networks:
      - elastic-pipeline

  cassandra:
    image: custom-cassandra:latest
    container_name: drk-cassandra-1
    networks:
      - elastic-pipeline
    environment:
      - JAVA_TOOL_OPTIONS="-Dbootstrap.servers=kafka:9092 -Dkafka.producer.bootstrap.servers=kafka:9092"
      - >-
        JDK_JAVA_OPTIONS=
        --add-opens java.base/java.lang=ALL-UNNAMED
        --add-opens java.base/java.util=ALL-UNNAMED
        --add-opens java.base/java.util.concurrent=ALL-UNNAMED
        --add-opens java.base/java.io=ALL-UNNAMED
        --add-opens java.base/java.rmi=ALL-UNNAMED
        --add-opens java.base/java.nio=ALL-UNNAMED
        --add-opens java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens java.base/sun.util.calendar=ALL-UNNAMED
        --add-opens java.base/math=ALL-UNNAMED
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./debezium-agent.properties:/debezium/debezium-agent.properties
    ports:
      - "9042:9042"

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es-setup
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "root"
    networks:
      - elastic-pipeline
    command: >
      bash -c '
        if [ ! -f config/certs/ca.zip ]; then
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo -ne "instances:\n  - name: es01\n    dns:\n      - es01\n      - localhost\n  - name: kibana\n    dns:\n      - kibana\n      - localhost\n" > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        chown -R root:root config/certs;
        until curl -s http://es01:9200 | grep -q "missing authentication credentials"; do sleep 5; done;
        curl -s -X POST -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" http://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}"
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/ca/ca.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    #depends_on:
    #  setup:
    #    condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: es01
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - es_data_01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=false
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # This is the most important line
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic-pipeline
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200 | grep -q 'cluster_name'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    #depends_on:
    #  es01:
    #    condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibana_data:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - xpack.security.enabled=false
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ENCRYPTION_KEY}
    links:
      - es01 # This forces a host entry for 'es01' inside the Kibana container
    networks:
      - elastic-pipeline

  connector-setup:
    image: curlimages/curl:latest
    container_name: connector-setup
    depends_on:
      - kafka-connect
      - es01
    networks:
      - elastic-pipeline
    volumes:
      - ./create-es-sink-connector.json:/config/create-es-sink-connector.json
      - ./create-es-index.json:/config/create-es-index.json
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while ! curl -s -f http://kafka-connect:8083/connectors > /dev/null 2>&1; do sleep 5; done
        sleep 10
        curl -X PUT 'http://es01:9200/events' -H 'Content-Type: application/json' -u elastic:changeme --data-binary @/config/create-es-index.json || true
        curl -X POST http://kafka-connect:8083/connectors -H 'Content-Type: application/json' --data-binary @/config/create-es-sink-connector.json

networks:
  elastic-pipeline:
    name: elastic-pipeline
    driver: bridge

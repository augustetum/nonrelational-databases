services:
    neo4j:
        image: neo4j:5.26.17-ubi9
        container_name: neo4j
        environment:
          NEO4J_AUTH: neo4j/darbsciu_rankuciu_klubas
        ports:
          - "7474:7474" # web interface
          - "7687:7687" # db server 
        volumes:
          - neo4j_data:/data

volumes:
  neo4j_data: